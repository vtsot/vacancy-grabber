# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    timezone: '%env(TIMEZONE)%'
    default_locale: 'en_GB'
    translation_cache_dir: '%kernel.project_dir%/var/cache/translations'

imports:
    # admins
    - { resource: ./admin.yaml }
    # VacancyGrabber
    - { resource: ../src/Presentation/Resources/config/services.yaml }
    - { resource: ../src/Infrastructure/Resources/config/services.yaml }


services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        App\Application\Shared\Bus\CommandHandlerInterface:
            tags:
                - { name: messenger.message_handler, bus: command.bus }

        App\Application\Shared\Bus\QueryHandlerInterface:
            tags:
                - { name: messenger.message_handler, bus: query.bus }

        App\Application\Shared\Bus\EventHandlerInterface:
            tags:
                - { name: messenger.message_handler, bus: event.bus }

        App\Domain\Source\Grabber\Grabber:
            tags:
                - { name: app.vacancy_Source_grabber_handler }

    app.vacancy_grabber.user_provider:
        class: App\Infrastructure\Security\UserProvider\RegularUserProvider
        tags:
            - { name: security.user_provider }

    app.vacancy_grabber.user_checker:
        class: App\Infrastructure\Security\UserChecker
        tags:
            - { name: security.user_checker }

    app.vacancy_grabber.authenticator:
        class: App\Presentation\Shared\Security\Authenticator\MainAuthenticator
        tags:
            - { name: security.authenticator }

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Component/*/ControllerRequest/'
            - '../src/Component/*/DTO/'
            - '../src/Component/*/Message/'
            - '../src/Component/*/Serializer/Context/'
            - '../src/Component/*/Contract/'
            - '../src/Component/*/Entity/'
            - '../src/Component/*/Exception/'
            - '../src/Contract/'
            - '../src/Exception/'
            - '../src/Kernel.php'

        # add more service definitions when explicit configuration is needed
        # please note that last definitions always *replace* previous ones

    app.admin_login_rate_limiter:
        class: Symfony\Component\Security\Http\RateLimiter\DefaultLoginRateLimiter
        arguments:
            $globalFactory: '@limiter.admin_login_global'
            $localFactory: '@limiter.admin_login_local'
            $secret: '%kernel.secret%'

    app.api_login_rate_limiter:
        class: App\Presentation\Shared\Security\RateLimiter\ApiSiteLoginRateLimiter
        arguments:
            $limiter: '@app.api_login_rate_limiter.default'

    app.api_login_rate_limiter.default:
        class: Symfony\Component\Security\Http\RateLimiter\DefaultLoginRateLimiter
        arguments:
            $globalFactory: '@limiter.api_site_login_global'
            $localFactory: '@limiter.api_site_login_local'
            $secret: '%kernel.secret%'
