services:
    _defaults:
        public: true
        autowire: true
        autoconfigure: true

    admin.vacancy:
        class: App\Admin\VacancyAdmin
        calls:
            - [ setBaseRouteName,       ['admin.vacancy'] ]
            - [ setBaseRoutePattern,    ['vacancy'] ]
            # - [ setTemplate,            ['list', 'admin\CRUD\user\list.html.twig'] ]
            - [ addChild,            [ '@admin.vacancy.note', 'vacancy' ] ]
        tags:
            - name: sonata.admin
              model_class: 'App\Entity\Vacancy'
              controller: 'App\Controller\Admin\VacancyCrudController'
              manager_type: orm
              group: MENU_GROUP.VACANCY
              label: MENU.VACANCY
              # translation_domain: '%admin_translation_domain%'


    admin.vacancy.note:
        class: App\Admin\VacancyNoteAdmin
        calls:
            - [ setBaseRouteName,    [ 'admin.vacancy.note' ] ]
            - [ setBaseRoutePattern, [ 'vacancy-note' ] ]
        tags:
            -   name: sonata.admin
                model_class: 'App\Entity\Note'
                manager_type: orm
                group: MENU_GROUP.VACANCY
                label: MENU.VACANCY_NOTE
                # translation_domain: '%admin_translation_domain%'
                show_in_dashboard: false
