services:
    _defaults:
        public: true
        autowire: true
        autoconfigure: true

    admin.company:
        class: App\Admin\CompanyAdmin
        calls:
            - [ setBaseRouteName,       ['admin.company'] ]
            - [ setBaseRoutePattern,    ['company'] ]
            # - [ setTemplate,            ['list', 'admin\CRUD\user\list.html.twig'] ]
            - [ addChild,            [ '@admin.company.note', 'company' ] ]
        tags:
            - name: sonata.admin
              model_class: 'App\Entity\Company'
              manager_type: orm
              group: MENU_GROUP.VACANCY
              label: MENU.COMPANY
              # translation_domain: '%admin_translation_domain%'


    admin.company.note:
        class: App\Admin\CompanyNoteAdmin
        calls:
            - [ setBaseRouteName,    [ 'admin.company.note' ] ]
            - [ setBaseRoutePattern, [ 'company-note' ] ]
        tags:
            -   name: sonata.admin
                model_class: 'App\Entity\Note'
                manager_type: orm
                group: MENU_GROUP.VACANCY
                label: MENU.COMPANY_NOTE
                # translation_domain: '%admin_translation_domain%'
                show_in_dashboard: false
