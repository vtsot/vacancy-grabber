services:
    _defaults:
        public: true
        autowire: true
        autoconfigure: true

    admin.note:
        class: App\Admin\NoteAdmin
        calls:
            - [ setBaseRouteName,       ['admin.note'] ]
            - [ setBaseRoutePattern,    ['note'] ]
            # - [ setTemplate,            ['list', 'admin\CRUD\user\list.html.twig'] ]
        tags:
            - name: sonata.admin
              model_class: 'App\Entity\Note'
              manager_type: orm
              group: MENU_GROUP.VACANCY
              label: MENU.NOTE
