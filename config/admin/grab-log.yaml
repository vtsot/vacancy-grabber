services:
    _defaults:
        public: true
        autowire: true
        autoconfigure: true

    admin.grab_log:
        class: App\Admin\GrabLogAdmin
        calls:
            - [ setBaseRouteName,       ['admin.grab_log'] ]
            - [ setBaseRoutePattern,    ['grab-log'] ]
            # - [ setTemplate,            ['list', 'admin\CRUD\user\list.html.twig'] ]
        tags:
            - name: sonata.admin
              model_class: 'App\Entity\GrabLog'
              manager_type: orm
              group: MENU_GROUP.VACANCY
              label: MENU.GRAB_LOG
