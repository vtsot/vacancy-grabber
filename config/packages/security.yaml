security:

    role_hierarchy:
        ROLE_USER:
            - IS_AUTHENTICATED_FULLY
            - IS_AUTHENTICATED_REMEMBERED

        ROLE_ADMIN:
            - ROLE_USER
            - ROLE_ADMIN_COMPANY_ALL
            - ROLE_ADMIN_COMPANY_NOTE_ALL
            - ROLE_ADMIN_NOTE_ALL
            - ROLE_ADMIN_SOURCE_ALL
            - ROLE_ADMIN_GRAB_LOG_ALL
            - ROLE_ADMIN_VACANCY_ALL
            - ROLE_ADMIN_VACANCY_NOTE_ALL
            - ROLE_ADMIN_USER_ALL_ALL
            - ROLE_ADMIN_USER_ADMIN_ALL
            - ROLE_ADMIN_USER_REGULAR_ALL

        ROLE_SUPERVISOR:
            - ROLE_ALLOWED_TO_SWITCH
            - ROLE_ADMIN
            - ROLE_ADMIN_USER_SUPERVISOR_ALL


    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\InMemoryUser:
            algorithm: 'plaintext'
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        api_doc_users:
            memory:
                users:
                    apidoc_user: { password: 'qd021ibf6l', roles: [ ROLE_API_DOC ] }

        regular_user_provider:
            id: App\VacancyGrabber\Application\Component\User\Security\UserProvider\RegularUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        api_doc:
            pattern: ^/api/doc
            http_basic:
                provider: api_doc_users
                realm: Basic

        admin:
            pattern: ^/admin|^/api/admin
            lazy: true
            provider: regular_user_provider

            form_login:
                login_path: admin.login
                check_path: admin.login_check
                default_target_path: sonata_admin_dashboard

            logout:
                path: admin.logout
                target: admin.login

            entry_point: form_login

        api:
            pattern:   ^/api
            stateless: true
            provider: regular_user_provider
            user_checker: App\VacancyGrabber\Application\Component\User\Security\UserChecker

            entry_point: jwt

#            login_throttling:
#                limiter: app.login_rate_limiter

            json_login:
                check_path: api.auth.login
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

            jwt: ~

            refresh_jwt:
                check_path: api.auth.refresh_token
                provider: regular_user_provider

        main:
            pattern: ^/
            lazy: true
            provider: regular_user_provider
            user_checker: App\VacancyGrabber\Application\Component\User\Security\UserChecker

            custom_authenticators:
                - App\VacancyGrabber\Application\Component\User\Security\Authenticator\MainAuthenticator
                #- App\Security\Authenticator\OAuth2\FacebookAuthenticator
                #- App\Security\Authenticator\OAuth2\GoogleAuthenticator
                #- App\Security\Authenticator\OAuth2\LinkedInAuthenticator

            entry_point: App\VacancyGrabber\Application\Component\User\Security\Authenticator\MainAuthenticator

            logout:
                path: web.auth.logout
                target: web.homepage

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: '^/(css|js|images|assets|favicon\.ico)', roles: PUBLIC_ACCESS }
        - { path: '^/admin/login', roles: PUBLIC_ACCESS }
        - { path: '^/admin', roles: ROLE_ADMIN }
        - { path: '^/api/doc', roles: ROLE_API_DOC }
        - { path: '^/api/auth/(login|refresh-token)', roles: PUBLIC_ACCESS }
        - { path: '^/api', roles: IS_AUTHENTICATED_FULLY }
        - { path: '^/auth/(login|forgot-password)', roles: PUBLIC_ACCESS }
        - { path: '^/',  roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
