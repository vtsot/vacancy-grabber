when@dev: &dev
    # See full configuration: https://symfony.com/bundles/ZenstruckFoundryBundle/current/index.html#full-default-bundle-configuration
    zenstruck_foundry:
        instantiator:
            use_constructor: true
        orm:
            reset:
                connections: [default]
                entity_managers: [default]
                mode: schema
        make_factory:
            default_namespace: DataFixtureFactory
        make_story:
            default_namespace: DataFixtureStory
        persistence:
            flush_once: true

when@test: *dev
