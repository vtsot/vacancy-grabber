services:
    php-fpm:
        build:
            context: ./.docker/php-fpm
            args:
                PHP_VERSION: ${PHP_VERSION:-8.4}
                USER_ID: ${USER_ID:-1000}
                GROUP_ID: ${GROUP_ID:-1000}
        restart: unless-stopped
        extra_hosts:
            - "vacancy-grabber.local:host-gateway"
            - "host.docker.internal:host-gateway"
        volumes:
            - ./:/var/www/html:rw
        networks:
            - vacancy-grabber-backend
            - shared-smtp
#        depends_on:
#            - redis

    nodejs:
        build: ./.docker/nodejs
        restart: unless-stopped
        volumes_from:
            - php-fpm
        depends_on:
            - php-fpm
#        ports:
#            - "8888:8888"

    nginx:
        build: ./.docker/nginx
        restart: unless-stopped
        volumes_from:
            - php-fpm
        networks:
            reverse-proxy:
            vacancy-grabber-backend:
                aliases:
                    - vacancy-grabber.local
                    - acceptance.vacancy-grabber.local
        expose:
            - "80"
        environment:
            - VIRTUAL_PORT=80
            - VIRTUAL_HOST=vacancy-grabber.local
            - HTTPS_METHOD=redirect
            - SELF_SIGNED_HOST=vacancy-grabber.local
        depends_on:
            - php-fpm

    selenium:
        image: selenium/standalone-firefox:latest
        restart: unless-stopped
        shm_size: 2g
        networks:
            - vacancy-grabber-backend
        expose:
            - "4444"
        environment:
            - SE_NODE_MAX_SESSIONS=1
            - SE_VNC_NO_PASSWORD=1
        ports:
            - "7900:7900"

    mysql:
        build: ./.docker/mysql
        restart: unless-stopped
        environment:
            - MYSQL_USER=user
            - MYSQL_PASSWORD=password
            - MYSQL_DATABASE=vacancy_grabber
            - MYSQL_ROOT_PASSWORD=password
            - MYSQL_ALLOW_EMPTY_PASSWORD=true
        volumes:
            - ./.docker/mysql/data:/var/lib/mysql
        networks:
            - vacancy-grabber-backend

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        restart: unless-stopped
        volumes:
            - ./.docker/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php
        networks:
            - reverse-proxy
            - vacancy-grabber-backend
        expose:
            - "80"
        environment:
            - UPLOAD_LIMIT=300M
            - VIRTUAL_PORT=80
            - VIRTUAL_HOST=webmysql.vacancy-grabber.local
            - HTTPS_METHOD=redirect
            - SELF_SIGNED_HOST=vacancy-grabber.local

    adminer:
        image: adminer
        restart: unless-stopped
        networks:
            - reverse-proxy
            - vacancy-grabber-backend
        expose:
            - "8080"
        environment:
            - VIRTUAL_PORT=8080
            - VIRTUAL_HOST=adminer.vacancy-grabber.local
            - HTTPS_METHOD=redirect
            - SELF_SIGNED_HOST=vacancy-grabber.local

networks:
    reverse-proxy:
        name: reverse-proxy
        external: true
    shared-smtp:
        name: shared-smtp
        external: true
    vacancy-grabber-backend:
        driver: bridge
