# Production stack. Usage:
#   docker compose -f docker-compose.prod.yaml --env-file .env.prod.local up -d --build
#
# Requires the shared Traefik from /home/dad/workspace/infrastructure on the external
# "reverse-proxy" network (see ../vps-setup/docs/vps-setup.md).

x-app: &app
    image: vacancy-grabber-prod-app:latest
    restart: unless-stopped
    env_file:
        - .env.prod.local
    volumes:
        - jwt:/var/www/html/config/jwt
    networks:
        - backend
    depends_on:
        mysql:
            condition: service_healthy

services:
    php-fpm:
        <<: *app
        build:
            context: .
            target: app

    worker:
        <<: *app
        command:
            - php
            - bin/console
            - messenger:consume
            - queue_high_priority
            - queue_standard_priority
            - queue_low_priority
            - --time-limit=3600
            - --memory-limit=256M
            - --no-interaction
        depends_on:
            php-fpm:
                condition: service_started
            mysql:
                condition: service_healthy

    nginx:
        image: vacancy-grabber-prod-nginx:latest
        build:
            context: .
            target: nginx
        restart: unless-stopped
        expose:
            - "80"
        labels:
            - traefik.enable=true
            - traefik.docker.network=reverse-proxy
            - traefik.http.services.vacancy-grabber.loadbalancer.server.port=80
            # Stage 1: access by IP / domain over HTTP
            - traefik.http.routers.vacancy-grabber.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN in .env.prod.local}`)
            - traefik.http.routers.vacancy-grabber.entrypoints=web
            - traefik.http.routers.vacancy-grabber.service=vacancy-grabber
            # Stage 2: domain + HTTPS (Let's Encrypt). Uncomment after DNS points to the VPS.
            # - traefik.http.routers.vacancy-grabber-https.rule=Host(`${APP_DOMAIN}`)
            # - traefik.http.routers.vacancy-grabber-https.entrypoints=websecure
            # - traefik.http.routers.vacancy-grabber-https.tls.certresolver=le
            # - traefik.http.routers.vacancy-grabber-https.service=vacancy-grabber
            # - traefik.http.routers.vacancy-grabber.middlewares=vacancy-grabber-redirect
            # - traefik.http.middlewares.vacancy-grabber-redirect.redirectscheme.scheme=https
            # - traefik.http.middlewares.vacancy-grabber-redirect.redirectscheme.permanent=true
        networks:
            - reverse-proxy
            - backend
        depends_on:
            - php-fpm

    mysql:
        image: mysql:8.0
        restart: unless-stopped
        command:
            - mysqld
            - --character-set-server=utf8mb4
            - --skip-name-resolve=ON
            - --max_allowed_packet=64M
        environment:
            - MYSQL_DATABASE=${MYSQL_DATABASE:?set MYSQL_DATABASE}
            - MYSQL_USER=${MYSQL_USER:?set MYSQL_USER}
            - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
        volumes:
            - mysql-data:/var/lib/mysql
            - ./.docker/mysql/config/mysqld.cnf:/etc/mysql/conf.d/mysqld.cnf:ro
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - backend

volumes:
    mysql-data:
    jwt:

networks:
    reverse-proxy:
        name: reverse-proxy
        external: true
    backend:
        driver: bridge
