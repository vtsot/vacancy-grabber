# Production stack. Usage:
#   docker compose -f docker-compose.prod.yaml --env-file .env.prod.local up -d --build
#
# Requires an external "reverse-proxy" network with nginx-proxy + acme-companion (see readme.md).

x-app: &app
    image: vacancy-grabber-prod-app:latest
    restart: unless-stopped
    env_file:
        - .env.prod.local
    volumes:
        - jwt:/var/www/html/config/jwt
    networks:
        - backend
    depends_on:
        mysql:
            condition: service_healthy

services:
    php-fpm:
        <<: *app
        build:
            context: .
            target: app

    worker:
        <<: *app
        command:
            - php
            - bin/console
            - messenger:consume
            - queue_high_priority
            - queue_standard_priority
            - queue_low_priority
            - --time-limit=3600
            - --memory-limit=256M
            - --no-interaction
        depends_on:
            php-fpm:
                condition: service_started
            mysql:
                condition: service_healthy

    nginx:
        image: vacancy-grabber-prod-nginx:latest
        build:
            context: .
            target: nginx
        restart: unless-stopped
        expose:
            - "80"
        environment:
            - VIRTUAL_HOST=${APP_DOMAIN:?set APP_DOMAIN in .env.prod.local}
            - VIRTUAL_PORT=80
            - LETSENCRYPT_HOST=${APP_DOMAIN}
            - HTTPS_METHOD=redirect
        networks:
            - reverse-proxy
            - backend
        depends_on:
            - php-fpm

    mysql:
        image: mysql:8.0
        restart: unless-stopped
        command:
            - mysqld
            - --character-set-server=utf8mb4
            - --skip-name-resolve=ON
            - --max_allowed_packet=64M
        environment:
            - MYSQL_DATABASE=${MYSQL_DATABASE:?set MYSQL_DATABASE}
            - MYSQL_USER=${MYSQL_USER:?set MYSQL_USER}
            - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
        volumes:
            - mysql-data:/var/lib/mysql
            - ./.docker/mysql/config/mysqld.cnf:/etc/mysql/conf.d/mysqld.cnf:ro
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - backend

volumes:
    mysql-data:
    jwt:

networks:
    reverse-proxy:
        name: reverse-proxy
        external: true
    backend:
        driver: bridge
