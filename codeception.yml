namespace: App\Tests
support_namespace: Support

paths:
    tests: tests
    output: tests/_output
    data: tests/_data
    support: tests/Support
    envs: tests/_envs

actor_suffix: Tester

extensions:
    enabled:
        - \Codeception\Extension\RunFailed

params:
    - .env
    - .env.test
    #- .env.test.local

settings:
    shuffle: false
    lint: true

coverage:
    enabled: true
    include:
        - src/*
    exclude:
        - src/Kernel.php
    show_uncovered: true
    show_only_summary:
