actor: WebTester

suite_namespace: App\Tests\Suite\Web

path: ./Suite/Web

modules:
    enabled:
        - PhpBrowser:
              url: http://nginx
        - REST:
              url: http://localhost
              depends: PhpBrowser
              part: Json
        -   Symfony:
                app_path: 'src'
                environment: 'test'
                debug: true
                part: SERVICES
        - Doctrine:
              depends: Symfony
              cleanup: true
        - App\Tests\Support\Helper\Web
        - Asserts
