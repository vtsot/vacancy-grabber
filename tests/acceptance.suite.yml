actor: AcceptanceTester

suite_namespace: App\Tests\Acceptance

path: ./Acceptance

modules:
    enabled:
        # Chromium in the `selenium` docker compose service (watch at http://localhost:7900)
        - WebDriver:
              url: http://vacancy-grabber.local
              host: selenium
              port: 4444
              path: ""
              browser: chrome
              window_size: 1920x1080
              clear_cookies: true
              capabilities:
                  acceptInsecureCerts: true
                  "goog:chromeOptions":
                      args: ["--no-sandbox", "--disable-dev-shm-usage"]
#        - REST:
#              url: http://localhost
#              depends: Symfony
#        - Doctrine:
#              depends: Symfony
#              cleanup: true
        - App\Tests\Support\Helper\Acceptance
        - Asserts

