actor: AcceptanceTester

suite_namespace: App\Tests\Acceptance

path: ./Acceptance

modules:
    enabled:
        # Firefox + geckodriver in the `selenium` docker compose service (watch at http://localhost:7900)
        - WebDriver:
              url: http://vacancy-grabber.local
              host: selenium
              port: 4444
              path: ""
              browser: firefox
              window_size: 1920x1080
              clear_cookies: true
              capabilities:
                  acceptInsecureCerts: true
        # Boots the kernel in the test process so Foundry factories work (services only, no browser actions)
        - Symfony:
              app_path: 'src'
              environment: 'test'
              debug: true
              part: SERVICES
        - Doctrine:
              depends: Symfony
              cleanup: true
        - App\Tests\Support\Helper\Acceptance
        - Asserts
