actor: AcceptanceTester

suite_namespace: App\Tests\Acceptance

path: ./Acceptance

modules:
    enabled:
        # Real Firefox on the host desktop: run `make geckodriver` first
        - WebDriver:
              url: https://vacancy-grabber.local
              host: host.docker.internal
              port: 4444
              path: ""
              browser: firefox
              window_size: 1920x1080
              clear_cookies: true
              capabilities:
                  acceptInsecureCerts: true
#        - REST:
#              url: http://localhost
#              depends: Symfony
#        - Doctrine:
#              depends: Symfony
#              cleanup: true
        - App\Tests\Support\Helper\Acceptance
        - Asserts

