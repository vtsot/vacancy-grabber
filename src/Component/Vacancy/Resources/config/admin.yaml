services:
    _defaults:
        public: true
        autowire: true
        autoconfigure: true

    admin.vacancy:
        class: 'App\Component\Vacancy\Admin\VacancyAdmin'
        calls:
            - [ setBaseRouteName,       ['admin.vacancy'] ]
            - [ setBaseRoutePattern,    ['vacancy'] ]
            - [ addChild,            [ '@admin.vacancy.note', 'vacancy' ] ]
        tags:
            - name: sonata.admin
              model_class: 'App\Component\Vacancy\Entity\Vacancy'
              controller: 'App\Component\Vacancy\Controller\Admin\VacancyAdminCrudController'
              manager_type: orm
              group: MENU_GROUP.VACANCY
              label: MENU.VACANCY

    admin.vacancy.note:
        class: 'App\Component\Vacancy\Admin\VacancyNoteAdmin'
        calls:
            - [ setBaseRouteName,    [ 'admin.vacancy.note' ] ]
            - [ setBaseRoutePattern, [ 'vacancy-note' ] ]
        tags:
            -   name: sonata.admin
                model_class: 'App\Component\Note\Entity\Note'
                manager_type: orm
                group: MENU_GROUP.VACANCY
                label: MENU.VACANCY_NOTE
                show_in_dashboard: false
