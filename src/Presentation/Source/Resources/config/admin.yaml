services:
    _defaults:
        public: true
        autowire: true
        autoconfigure: true

    admin.source:
        class: 'App\Presentation\Source\Admin\SourceAdmin'
        calls:
            - [ setBaseRouteName,       ['admin.source'] ]
            - [ setBaseRoutePattern,    ['source'] ]
        tags:
            - name: sonata.admin
              model_class: 'App\Domain\Source\Entity\Source'
              controller: 'App\Presentation\Source\Controller\Admin\SourceAdminCrudController'
              manager_type: orm
              group: MENU_GROUP.VACANCY
              label: MENU.SOURCE
