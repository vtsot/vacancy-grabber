imports:
    - { resource: doctrine.yaml }

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    App\VacancyGrabber\Domain\Company\Repository\CompanyRepositoryInterface:
        class: App\VacancyGrabber\Infrastructure\Doctrine\Repository\CompanyDoctrineRepository

    App\VacancyGrabber\Domain\Note\Repository\NoteRepositoryInterface:
        class: App\VacancyGrabber\Infrastructure\Doctrine\Repository\NoteDoctrineRepository

    App\VacancyGrabber\Domain\User\Repository\UserRepositoryInterface:
        class: App\VacancyGrabber\Infrastructure\Doctrine\Repository\UserDoctrineRepository

    App\VacancyGrabber\Domain\GrabLog\Repository\GrabLogRepositoryInterface:
        class: App\VacancyGrabber\Infrastructure\Doctrine\Repository\GrabLogDoctrineRepository

    App\VacancyGrabber\Domain\Source\Repository\SourceRepositoryInterface:
        class: App\VacancyGrabber\Infrastructure\Doctrine\Repository\SourceDoctrineRepository

    App\VacancyGrabber\Domain\Vacancy\Repository\VacancyRepositoryInterface:
        class: App\VacancyGrabber\Infrastructure\Doctrine\Repository\VacancyDoctrineRepository
