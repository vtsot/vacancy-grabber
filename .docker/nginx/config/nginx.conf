worker_processes            auto;
pid                         /run/nginx.pid;

events {
    worker_connections      768;
    multi_accept            on;
    use                     epoll;
}

http {
    log_format              json '{"timestamp": "$time_iso8601","remote_addr": "$http_x_forwarded_for","host": "$host","status": $status,"request_method": "$request_method","request_uri": "$request_uri","server_addr": "$server_addr","server_port": $server_port,"server_protocol": "$server_protocol", "http_user_agent": "$http_user_agent","upstream_host": "$host","upstream_addr": "$upstream_addr","upstream_status": "$upstream_status","upstream_connect_time": "$upstream_connect_time","upstream_response_time": "$upstream_response_time","body_bytes_sent": $body_bytes_sent,"bytes_sent": $bytes_sent,"upstream_bytes_received": "$upstream_bytes_received","request_id": "$request_id","request_length": $request_length}';
    sendfile                on;
    sendfile_max_chunk      16m;
    tcp_nopush              on;
    tcp_nodelay             on;
    keepalive_timeout       75;
    types_hash_max_size     2048;
    server_tokens           off;
    charset                 utf-8;
    include                 /etc/nginx/mime.types;
    default_type            application/octet-stream;
    access_log              /dev/stdout json;
    error_log               /dev/stderr warn;

    client_header_timeout   30s;
    client_body_timeout     30s;
    client_max_body_size    64m;
    client_body_buffer_size 128K;
    client_header_buffer_size 128k;

    large_client_header_buffers 4 16k;
    open_file_cache         max=1000 inactive=30s;
    open_file_cache_valid   45s;
    open_file_cache_min_uses 2;
    open_file_cache_errors  off;
    fastcgi_read_timeout    300;

    gzip                    on;
    gzip_vary               on;
    gzip_proxied            any;
    gzip_comp_level         6;
    gzip_buffers            16 8k;
    gzip_http_version       1.1;
    gzip_types              application/x-javascript application/javascript text/javascript text/plain text/css text/xml application/json application/vnd.ms-fontobject application/x-font-opentype application/x-font-truetype application/x-font-ttf application/xml font/* image/*;
    include                 /etc/nginx/conf.d/*.conf;
}
