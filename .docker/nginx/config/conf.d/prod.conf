upstream upstream-php {
    server php-fpm:9000;
}

server {
    listen 80 default_server backlog=8192;
    listen [::]:80 default_server backlog=8192;

    server_name _;

    root /var/www/html/public;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }
    location ~ /\. { access_log off; deny all; }

    # Hashed (versioned) build assets and bundle files can be cached long-term
    location ~ ^/(assets|bundles)/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass upstream-php;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        set $path_info $fastcgi_path_info;
        fastcgi_param PATH_INFO $path_info;

        # nginx only holds public/ - PHP code lives in the php-fpm container at the same path
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;

        fastcgi_buffer_size          128k;
        fastcgi_buffers              4 256k;
        fastcgi_busy_buffers_size    256k;

        fastcgi_connect_timeout 60;
        fastcgi_read_timeout    300;
        fastcgi_send_timeout    300;

        internal;
    }

    location ~ \.php$ {
        access_log off;
        return 404;
    }

    error_log /dev/stderr warn;
}
